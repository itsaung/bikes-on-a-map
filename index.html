<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikes on a Map</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="map.css" />
  </head>
  <body>
    <h1>Bikes on a Map</h1>
    <p>Bluebikes traffic in Boston and Cambridge.</p>
    <div class="map-wrap">
      <div id="map">
        <svg></svg>
      </div>
      <label>
        Filter by time:
        <input type="range" id="time-slider" min="-1" max="1440" value="-1" />
        <output id="selected-time"></output>
        <span id="any-time">(any time)</span>
      </label>
    </div>
    <div class="legend">
      <div style="--departure-ratio: 1">More departures</div>
      <div style="--departure-ratio: 0.5">Balanced</div>
      <div style="--departure-ratio: 0">More arrivals</div>
    </div>
    <div id="station-tooltip" hidden></div>
    <script src="map.js" type="module"></script>
  </body>
</html>
